[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "cancun"

# Robinhood Chain explorers (Blockscout). Use with:
#   forge verify-contract <addr> <contract> --chain-id 46630 \
#     --verifier blockscout --verifier-url https://explorer.testnet.chain.robinhood.com/api/
[etherscan]
robinhood-testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
